name: Backfill Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Dogecoin Core version (e.g., 1.14.8)'
        required: true
      keys:
        description: 'GPG key fingerprints (space-separated). Leave empty to use repo KEYS file. Empty KEYS file fails closed (no TOFU).'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve KEYS (non-empty required — no TOFU path)
        id: keys
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.keys }}" ]; then
            RESOLVED="${{ github.event.inputs.keys }}"
            # collapse whitespace
            RESOLVED=$(echo "$RESOLVED" | xargs)
          else
            RESOLVED=$(tr '\n' ' ' < KEYS | xargs)
          fi
          if [ -z "$RESOLVED" ]; then
            echo "ERROR: KEYS must be non-empty (workflow input or KEYS file). TOFU auto-import is disabled."
            exit 1
          fi
          echo "keys=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Using KEYS: $RESOLVED"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.event.inputs.version }}
            KEYS=${{ steps.keys.outputs.keys }}
          tags: ghcr.io/kub0-ai/dogecoin-core:${{ github.event.inputs.version }}
          cache-from: type=registry,ref=ghcr.io/kub0-ai/dogecoin-core:buildcache
          cache-to: type=registry,ref=ghcr.io/kub0-ai/dogecoin-core:buildcache,mode=max

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Dogecoin Core ${{ github.event.inputs.version }}" || true
          git push origin "v${{ github.event.inputs.version }}" || true
