name: Watch Upstream Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect upstream + bump main if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM_REPO="dogecoin/dogecoin"
          LATEST=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases?per_page=30" \
            | jq -r '
              [.[] | select(.prerelease == false and .draft == false) | .tag_name
               | ltrimstr("v")
               | select(test("^[0-9]+(\\.[0-9]+){1,3}$"))]
              | sort_by(split(".") | map(tonumber))
              | last
            ')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not detect upstream version"; exit 1
          fi
          CURRENT=$(tr -d '[:space:]' < VERSION)
          echo "upstream=$LATEST current=$CURRENT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already up to date"
            exit 0
          fi
          # Direct bump on main → build.yml (paths: VERSION) rebuilds the image.
          # Org setting blocks Actions from opening PRs; direct commit is the reliable path.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$LATEST" > VERSION
          git add VERSION
          git commit -m "release: bump to v${LATEST} (auto from ${UPSTREAM_REPO})"
          git push origin HEAD:main
          echo "Pushed VERSION ${CURRENT} → ${LATEST}; build.yml will remake the image"
