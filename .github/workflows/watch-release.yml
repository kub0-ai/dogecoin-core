name: Watch Upstream Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/dogecoin/dogecoin/releases?per_page=30" \
            | jq -r '
              [.[] | select(.prerelease == false and .draft == false) | .tag_name
               | ltrimstr("v")
               | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))]
              | sort_by(split(".") | map(tonumber))
              | last
            ')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Could not detect upstream version"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "tag=v${LATEST}" >> "$GITHUB_OUTPUT"
          echo "Latest upstream: v${LATEST}"

      - name: Read current version
        id: current
        run: |
          CURRENT=$(tr -d '[:space:]' < VERSION)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Ensure release branch + PR (auto-merge)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.upstream.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Already up to date at ${CURRENT}"
            exit 0
          fi
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            echo "$VERSION" > VERSION
            if ! git diff --quiet VERSION 2>/dev/null; then
              git add VERSION && git commit -m "release: bump to v${VERSION}" && git push origin "${BRANCH}"
            fi
          else
            git checkout -b "$BRANCH"
            echo "$VERSION" > VERSION
            git add VERSION
            git commit -m "release: bump to v${VERSION}"
            git push origin "$BRANCH"
          fi

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            gh pr create \
              --title "Release ${VERSION}" \
              --body "$(cat <<EOF
          ## Dogecoin Core ${VERSION}

          Upstream release: https://github.com/dogecoin/dogecoin/releases/tag/${{ steps.upstream.outputs.tag }}

          Auto-merged by watch-release → build.yml remakes the image.

          Merging triggers build of \`ghcr.io/kub0-ai/dogecoin-core:${VERSION}\`.
          EOF
          )"
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          fi
          if [ -n "$PR" ]; then
            gh pr merge "$PR" --squash --delete-branch || gh pr merge "$PR" --auto --squash || true
            echo "PR #${PR} merge requested (rebuild of ghcr.io/kub0-ai/dogecoin-core:${VERSION})"
          fi
